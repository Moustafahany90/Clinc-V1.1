# Phase 9.1 optional resource-limit overlay.
#
# The base compose file intentionally has no resource ceilings. Apply this
# overlay on the stated production host (Xeon E3-1225 v5, 16 GB RAM):
#
#   docker compose -f docker-compose.yml -f docker-compose.limits.yml up -d
#   # with TLS:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml \
#     -f docker-compose.limits.yml up -d
#
# Sizing target: <= 9.5 GB hard memory across all services, leaving >= 6 GB
# for the host OS, page cache and Chromium's child processes outside the Node
# heap. CPU values are burst quotas, not reservations. Validate before use:
#   docker compose -f docker-compose.yml -f docker-compose.limits.yml config

services:
  db:
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0
    pids_limit: 200

  migrate:
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 100

  backend:
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 1.5
    pids_limit: 300
    environment:
      # Leave headroom inside the 3 GB container for the Chromium PDF renderer,
      # which allocates outside the V8 old space.
      NODE_OPTIONS: --max-old-space-size=1536

  web:
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 100

  evolution:
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 200

# Caddy is intentionally absent: it is defined only in docker-compose.tls.yml.
# Declaring it here would create an inert, config-less service whenever this
# overlay is used without TLS. The optional TLS front door remains unthrottled.
