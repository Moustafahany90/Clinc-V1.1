# Optional Phase 7 monitoring overlay — DISABLED BY DEFAULT.
#
# The service below is behind the `monitoring` Compose profile, so plain
# `docker compose up -d` is unchanged. To opt in explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
#     --profile monitoring up -d clinic-monitor
#
# It runs read-only checks and writes JSONL alerts to a local sink. Phase 7.1
# adds opt-in Telegram delivery and an external heartbeat hook: both are inert
# unless their environment variables are supplied from a protected env file.
# No credential or destination is stored in this repository.

services:
  clinic-monitor:
    profiles: ["monitoring"]
    image: bash:5-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["bash", "/app/scripts/p7-monitor.sh", "--loop"]
    environment:
      P7_STATE_DIR: /var/lib/clinic-monitor
      P7_ALERT_SINK: /var/lib/clinic-monitor/alerts.jsonl
      P7_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ultrasound-clinic}
      # Phase 8.3.1: one approved backup root; the script derives the tier,
      # manifests, logs, quarantine and wal-archive directories from it.
      P7_BACKUP_ROOT: ${P7_BACKUP_ROOT:-/mnt/clinic-backups}
      P7_BACKUP_UUID: ${P7_BACKUP_UUID:-0f21089c-c507-4903-96e5-daf637100d53}
      P7_BACKUP_FSTYPE: ${P7_BACKUP_FSTYPE:-ext4}
      # Phase 9.5: read-only WAL backlog check against the dedicated archive.
      P7_WAL_DIRS: ${P7_WAL_DIRS:-/mnt/clinic-backups/wal-archive}
      P7_WAL_COUNT_WARN: ${P7_WAL_COUNT_WARN:-50}
      P7_WAL_COUNT_HIGH: ${P7_WAL_COUNT_HIGH:-200}
      P7_WAL_COUNT_CRITICAL: ${P7_WAL_COUNT_CRITICAL:-500}
      P7_WAL_AGE_WARN_SECONDS: ${P7_WAL_AGE_WARN_SECONDS:-900}
      P7_WAL_AGE_HIGH_SECONDS: ${P7_WAL_AGE_HIGH_SECONDS:-3600}
      P7_WAL_AGE_CRITICAL_SECONDS: ${P7_WAL_AGE_CRITICAL_SECONDS:-7200}
      # Phase 9.6: PITR base backup age, required-WAL validity and archive
      # freshness. These are read-only checks; no scheduler or delivery is enabled.
      P7_WAL_ARCHIVE_DIR: ${P7_WAL_ARCHIVE_DIR:-/mnt/clinic-backups/wal-archive}
      P7_PITR_AGE_WARN_HOURS: ${P7_PITR_AGE_WARN_HOURS:-72}
      P7_PITR_AGE_HIGH_HOURS: ${P7_PITR_AGE_HIGH_HOURS:-168}
      P7_PITR_AGE_CRIT_HOURS: ${P7_PITR_AGE_CRIT_HOURS:-336}
      P7_WAL_FRESHNESS_WARN_SECONDS: ${P7_WAL_FRESHNESS_WARN_SECONDS:-600}
      P7_WAL_FRESHNESS_HIGH_SECONDS: ${P7_WAL_FRESHNESS_HIGH_SECONDS:-1200}
      P7_WAL_FRESHNESS_CRITICAL_SECONDS: ${P7_WAL_FRESHNESS_CRITICAL_SECONDS:-1800}
      # Phase 9.8/PB-29: `cert` is a default check. Provide at least one source
      # (newline-separated public cert paths and/or host:port TLS endpoints).
      P7_CERT_FILES: ${P7_CERT_FILES:-}
      P7_CERT_ENDPOINTS: ${P7_CERT_ENDPOINTS:-}
      P7_CERT_WARN_DAYS: ${P7_CERT_WARN_DAYS:-30}
      P7_CERT_HIGH_DAYS: ${P7_CERT_HIGH_DAYS:-14}
      P7_CERT_CRITICAL_DAYS: ${P7_CERT_CRITICAL_DAYS:-7}
      P7_CERT_ENDPOINT_TIMEOUT_SEC: ${P7_CERT_ENDPOINT_TIMEOUT_SEC:-10}
      P7_MAX_AGE_HOURS: ${P7_BACKUP_MAX_AGE_HOURS:-26}
      P7_INTERVAL_SEC: ${P7_MONITOR_INTERVAL_SEC:-300}
      P7_ALERT_REPEAT_SEC: ${P7_ALERT_REPEAT_SEC:-3600}
      P7_SINK_MAX_BYTES: ${P7_SINK_MAX_BYTES:-1048576}
      P7_SINK_KEEP: ${P7_SINK_KEEP:-5}
      # Optional delivery/heartbeat configuration. Leave blank to disable.
      P7_TELEGRAM_BOT_TOKEN: ${P7_TELEGRAM_BOT_TOKEN:-}
      P7_TELEGRAM_CHAT_ID: ${P7_TELEGRAM_CHAT_ID:-}
      P7_TELEGRAM_API_BASE: ${P7_TELEGRAM_API_BASE:-https://api.telegram.org}
      P7_HOST_LABEL: ${P7_HOST_LABEL:-clinic-monitor}
      P7_HEARTBEAT_URL: ${P7_HEARTBEAT_URL:-}
      P7_ALLOW_INSECURE_TEST: ${P7_ALLOW_INSECURE_TEST:-0}
      TZ: ${APP_TIMEZONE:-Africa/Cairo}
    volumes:
      - ./scripts:/app/scripts:ro
      - p7_monitor_state:/var/lib/clinic-monitor
      # Read-only view of the approved backup disk. Without this bind mount a
      # containerised monitor cannot see the host mount or its backup sets.
      - /mnt/clinic-backups:/mnt/clinic-backups:ro
      # Read-only Docker socket: checks use `docker ps`/`inspect` only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - clinic_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  p7_monitor_state: {}
