# Ultrasound Clinic - SPA host and API reverse proxy.
# The browser only ever talks to this origin; the backend port is not published.

# Phase 7.1 access-log redaction (logging only, no routing/proxy change).
# $uri is the normalised path WITHOUT the query string; $request and
# $request_uri are deliberately not used. No Referer, Authorization or Cookie
# value is logged. http-level access_log from the base image is replaced by the
# server-level directive below, so only this format is written.
log_format clinic_access escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"request_id":"$request_id"}';

# Phase 7.2 upstream-failure diagnostics. Nginx error_log messages for upstream
# connect/timeout failures embed the full request line (query string) and
# Referer, and cannot be reformatted. Keep only critical server errors there;
# record operational detail in this path-only structured access log instead.
# No $request, $request_uri, $http_referer, Authorization or Cookie is used.
log_format clinic_upstream_failure escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","path":"$uri",'
    '"status":$status,"class":"$clinic_upstream_failure_class",'
    '"upstream_service":"backend","upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"connect_time":"$upstream_connect_time",'
    '"header_time":"$upstream_header_time",'
    '"response_time":"$upstream_response_time",'
    '"duration":$request_time,"request_id":"$request_id"}';

map $status $clinic_upstream_failure {
    default 0;
    ~^5[0-9][0-9] 1;
}
map $status $clinic_upstream_failure_class {
    default "upstream_http_failure";
    502 "upstream_connect_failure";
    503 "upstream_unavailable";
    504 "upstream_timeout";
}

# Cache policy per request path. Kept in one map so the response headers can be
# declared once at server level: a location-level add_header would otherwise
# stop nginx inheriting the security headers below.
map $uri $clinic_cache_control {
    default                                  "no-store, must-revalidate";
    ~^/assets/                               "public, max-age=31536000, immutable";
    ~*\.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Request-bearing upstream errors are emitted at "error" level. Retain only
    # critical nginx errors here; sanitized upstream diagnostics are written to
    # the dedicated access log below. This does not disable error_log.
    error_log /var/log/nginx/error.log crit;

    access_log /var/log/nginx/access.log clinic_access;
    access_log /var/log/nginx/upstream-failures.log clinic_upstream_failure if=$clinic_upstream_failure;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in step with MAX_UPLOAD_MB (25 MB) plus multipart overhead.
    client_max_body_size 32m;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Declared once so every response (including proxied API replies and the
    # SPA fallback) carries them.
    add_header Cache-Control $clinic_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Liveness probe used by the compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the shell: a stale index.html can point at deleted assets.
    location = /index.html {
        try_files $uri =404;
    }

    # Fingerprinted Vite assets are immutable (see the map above).
    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        try_files $uri =404;
    }

    # API reverse proxy. Cookies, uploads and blobs pass through unchanged.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy has already resolved the real client address. Forward its
        # X-Forwarded-For unchanged instead of appending another proxy hop, so
        # TRUST_PROXY=1 (one trusted hop) still yields the client IP.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Client-side routes fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
