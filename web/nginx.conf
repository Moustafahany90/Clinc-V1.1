# Ultrasound Clinic - SPA host and API reverse proxy.
# The browser only ever talks to this origin; the backend port is not published.

# Cache policy per request path. Kept in one map so the response headers can be
# declared once at server level: a location-level add_header would otherwise
# stop nginx inheriting the security headers below.
map $uri $clinic_cache_control {
    default                                  "no-store, must-revalidate";
    ~^/assets/                               "public, max-age=31536000, immutable";
    ~*\.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in step with MAX_UPLOAD_MB (25 MB) plus multipart overhead.
    client_max_body_size 32m;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Declared once so every response (including proxied API replies and the
    # SPA fallback) carries them.
    add_header Cache-Control $clinic_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Liveness probe used by the compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the shell: a stale index.html can point at deleted assets.
    location = /index.html {
        try_files $uri =404;
    }

    # Fingerprinted Vite assets are immutable (see the map above).
    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        try_files $uri =404;
    }

    # API reverse proxy. Cookies, uploads and blobs pass through unchanged.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy has already resolved the real client address. Forward its
        # X-Forwarded-For unchanged instead of appending another proxy hop, so
        # TRUST_PROXY=1 (one trusted hop) still yields the client IP.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Client-side routes fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
